<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title></title>
    <script>
      /* 开屏动画：第 0 秒开播（含「黑→亮」片头），播完回循环点接着放。 */

      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.documentElement.dataset.platform = 'windows'
      }
      if (!navigator.language.toLowerCase().startsWith('zh')) {
        document.documentElement.dataset.lang = 'en'
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
        --ink: #eef2ff;
        --ink-soft: #a8b6cd;
        --peri: #b1b3e2;
        --ice: #9dc0f0;
        --deep: #05070d;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: var(--deep); color: var(--ink); }

      /* 静图都没了：这里就是动画本身 */
      .boot {
        position: fixed; inset: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        background: var(--deep);
        animation: boot-in 0.6s ease-out both;
      }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }

      .veil {
        position: fixed; inset: 0;
        background: linear-gradient(180deg, rgba(5, 7, 13, 0.30), rgba(5, 7, 13, 0.06) 40%, rgba(5, 7, 13, 0.66));
        pointer-events: none;
      }

      /* 文案放底部、水平居中：画面交给动画本身 */
      main {
        position: fixed; inset: 0; z-index: 3;
        display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
        gap: 10px; padding: 0 48px 46px 48px; text-align: center;
      }
      html[data-platform='windows'] main { padding-bottom: 54px; }

      /* 标题：银白金属渐变。渐变色靠 background-clip:text 刷在字身上，
         文字阴影得用 filter:drop-shadow —— 字身是透明的，text-shadow 会整块糊出来。 */
      .title {
        margin: 0; font-size: 38px; line-height: 1.22; font-weight: 700; letter-spacing: 0.06em;
        color: #f4f7ff;
        filter: drop-shadow(0 3px 14px rgba(4, 8, 20, 0.9)) drop-shadow(0 1px 1px rgba(2, 5, 12, 0.65));
        animation: rise-in 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) 0.2s both;
      }
      @supports (-webkit-background-clip: text) or (background-clip: text) {
        .title {
          /* 银白金属：上缘高光 → 中段银灰过渡带 → 下缘反光 */
          background-image: linear-gradient(
            176deg,
            #ffffff 0%,
            #f8fbff 16%,
            #e5ecf9 34%,
            #b9c6dd 46%,
            #dfe7f5 54%,
            #fdfeff 66%,
            #ffffff 80%,
            #e9effa 100%
          );
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          color: transparent;
        }
      }
      .status {
        margin: -4px 0 2px; font-size: 12.5px; color: var(--ink-soft);
        text-shadow: 0 2px 10px rgba(4, 8, 20, 0.7);
        animation: rise-in 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) 0.35s both;
      }
      @keyframes rise-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      /* 慢启动提示：只有真的等了 12 秒才出现（插件增删后 pnpm 要重新链接，实测会等到 70 秒左右） */
      .slow {
        margin: 0; font-size: 12px; color: var(--peri); opacity: 0; min-height: 16px;
        text-shadow: 0 2px 10px rgba(4, 8, 20, 0.7);
        animation: slow-in 0.7s ease 12s both;
      }
      @keyframes slow-in { from { opacity: 0; } to { opacity: 1; } }

      .bar {
        position: relative; width: 216px; height: 3px; border-radius: 99px;
        background: rgba(177, 179, 226, 0.22); overflow: hidden;
        animation: rise-in 0.7s ease-out 0.5s both;
      }
      .bar > i {
        position: absolute; inset: 0; border-radius: 99px;
        background: linear-gradient(90deg, rgba(157, 192, 240, 0), var(--ice), var(--peri), rgba(157, 192, 240, 0));
        transform: translateX(-100%);
        animation: bar-slide 1.25s ease-in-out infinite;
      }
      @keyframes bar-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

      html[data-lang='en'] .zh { display: none; }
      html:not([data-lang='en']) .en { display: none; }

      @media (prefers-reduced-motion: reduce) {
        .title, .status, .bar, .bar > i { animation: none !important; }
        .slow { animation-duration: 0.01s; }
      }
    </style>
  </head>
  <body>
    <!-- 视频路径由 apply-splash.ps1 在投放时替换成真实路径（默认 ../wallpaper.mp4） -->
    <video
      class="boot"
      id="boot"
      src="__WALLPAPER_SRC__"
      data-loop-start="1"
      autoplay
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
    ></video>
    <div class="veil" aria-hidden="true"></div>

    <main>
      <h1 class="title">
        <span class="zh">探索未至之境</span>
        <span class="en">Explore the Uncharted</span>
      </h1>
      <p class="status">
        <span class="zh">深空联合向您致意</span>
        <span class="en">The Deep Space Union salutes you.</span>
      </p>
      <p class="slow">
        <span class="zh">正在重新链接插件（刚刚增删过插件时会久一点），再等一会儿就好</span>
        <span class="en">Relinking plugins after a plugin change — hang tight.</span>
      </p>
      <div class="bar" aria-hidden="true"><i></i></div>
    </main>

    <script>
      /* 一遍播完 → 回到循环点接着播；卡在末帧也能自愈。
      /* 一遍播完 → 回到循环点接着播；卡在末帧也能自愈。 */
      (function () {
        var v = document.getElementById('boot')
        if (!v) return
        var loopStart = parseFloat(v.getAttribute('data-loop-start')) || 0
        var looping = false
        function loopBack() {
          if (looping) return
          looping = true
          try { v.currentTime = loopStart } catch (e) {}
          var p = v.play()
          if (p && p.catch) p.catch(function () {})
          setTimeout(function () { looping = false }, 600)
        }
        v.addEventListener('ended', loopBack)
        v.addEventListener('timeupdate', function () {
          var d = v.duration
          if (!isFinite(d) || d <= 0) return
          if (v.paused && v.currentTime >= d - 0.05) loopBack()
        })
        var p = v.play()
        if (p && p.catch) p.catch(function () {})
      })()
    </script>
  </body>
</html>
